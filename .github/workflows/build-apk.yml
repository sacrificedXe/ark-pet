name: Build arknights-pet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: latest
          build-tools-version: 34.0.0

      - name: Verify WebP assets committed
        run: |
          N=$(ls app/src/main/assets/pet/cloud_trail_*.webp 2>/dev/null | wc -l)
          echo "cloud_trail webp count: $N"
          if [ "$N" -lt 5 ]; then echo "::error::cloud_trail webp assets missing in repo"; exit 1; fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK as arknights-pet
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/arknights-pet-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arknights-pet-debug-apk
          path: dist/arknights-pet-debug.apk
          retention-days: 7

      - name: Print APK Info
        if: success()
        run: |
          APK=dist/arknights-pet-debug.apk
          echo "APK size: $(du -h $APK | cut -f1)"
          unzip -l $APK | grep "assets/pet" || true
