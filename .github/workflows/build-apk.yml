name: Build ArkPet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: latest
          build-tools-version: 34.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install Spine bake deps
        working-directory: scripts
        run: npm ci

      - name: Bake 云迹 Spine → WebP
        working-directory: scripts
        run: node bake_cloud_trail.mjs

      - name: Verify WebP outputs
        run: |
          ls -la app/src/main/assets/pet/cloud_trail_*.webp

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-pet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload WebP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-trail-webp
          path: app/src/main/assets/pet/cloud_trail_*.webp
          retention-days: 7

      - name: Print APK Info
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -h $APK | cut -f1)"
          echo "Version: 0.3.0 (neural)"
